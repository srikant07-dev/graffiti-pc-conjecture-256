name: Verify Lean proof
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl -fsSLo "$RUNNER_TEMP/elan-init.sh" https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check proof and axioms
        run: bash scripts/verify.sh
